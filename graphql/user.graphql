query meUser {
  meUser {
    _id
    username
    firstName
    lastName
    spotifyId
    email
    bio
    dob
    type
    isAccountVerified
    isProfileCompleted
    deviceDetails
    intro
    instagramLink
    topArtists {
      name
    }
    topTracks {
      name
    }
    recentlyPlayed {
      name
    }
    followers
    followings
    blockedByMe
    isPrivate
  }
}

mutation saveUserToken($input: UserToken!) {
  saveUserTokens(input: $input)
}

mutation userSingIn($input: UserSignInInput!) {
  userSingIn(input: $input)
}

query checkById($id: String!) {
  checkById(id: $id)
}

query getUserProfileInfo($id: String!, $page: Float!, $limit: Float!) {
  getUserProfileInfo(id: $id, page: $page, limit: $limit) {
    username
    firstName
    lastName
    bio
    profilePic
    followersCount
    followingsCount
    isPrivate
    posts {
      posts {
        _id
        postUrl
        waveUrl
        createdAt
        reactionsCount
        commentsCount
        caption
      }
      totalCount
      page
      totalPages
    }
  }
}

query fetchFriendStatus($id: String!) {
  fetchFriendStatus(id: $id)
}

mutation sendRequest($id: String!) {
  sendRequest(id: $id)
}
mutation acceptRequest($id: String!) {
  acceptRequest(id: $id)
}
mutation deleteRequest($id: String!) {
  deleteRequest(id: $id)
}
