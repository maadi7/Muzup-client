# Comment Mutations

# Add a new comment to a post
mutation addComment($input: CommentInput!) {
  addComment(input: $input)
}

# Delete a comment (only by comment owner)  
mutation deleteComment($commentId: String!) {
  deleteComment(commentId: $commentId)
}

# Reply to an existing comment
mutation replyToComment($input: CommentInput!) {
  replyToComment(input: $input)
}

# Get top-level comments for a post with pagination
query getComments($postId: String!, $page: Float!) {
  getComments(postId: $postId, page: $page) {
    _id
    postId {
      _id
    }
    parentId {
      _id
      content
    }
    content
    taggedUserIds {
      _id
      username
      profilePic
    }
    createdAt
    updatedAt
    userId {
      _id
      username
      profilePic
    }
  }
}

query getReplies($parentId: String!, $page: Float!) {
  getReplies(parentId: $parentId, page: $page) {
    comments {
      _id
      postId {
        _id
      }
      parentId {
        _id
        content
      }
      content
      taggedUserIds {
        _id
        username
        profilePic
      }
      createdAt
      updatedAt
      userId {
        _id
        username
        profilePic
      }
      replyToUserId {
        _id
        username
      }
    }
    hasMore
  }
}

